name: Build Meshtastic Mod IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Prepare sideload compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Meshtastic/MeshtasticAppDelegate.swift")
          source = path.read_text()
          old = '''\t\tINPreferences.requestSiriAuthorization { status in
          \t\t\tLogger.services.info("Siri authorization status: \\(String(describing: status))")
          \t\t}
          '''
          new = '''\t\t// Sideload/Personal Team builds cannot receive the Siri entitlement.
          \t\t// Calling requestSiriAuthorization without that entitlement aborts at launch.
          \t\tLogger.services.info("Skipping Siri authorization request in sideload build")
          '''
          if old not in source:
              raise SystemExit("Expected Siri authorization block not found; update sideload patch")
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace Meshtastic.xcworkspace \
            -scheme Meshtastic \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/MeshtasticDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild-ipa.log"

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/MeshtasticDerivedData/Build/Products/Debug-iphoneos/Meshtastic.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Meshtastic.app not found at expected path: $APP_PATH" >&2
            find "$RUNNER_TEMP/MeshtasticDerivedData/Build/Products" -maxdepth 3 -type d -name '*.app' -print || true
            exit 1
          fi

          echo "Built app identity:"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist" || true

          echo "Embedded app extensions before sideload stripping:"
          find "$APP_PATH" -maxdepth 4 \( -name '*.appex' -o -name '*.app' \) -print || true

          # Full IPA, preserving Watch app and extensions.
          rm -rf "$RUNNER_TEMP/full"
          mkdir -p "$RUNNER_TEMP/full/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/full/Payload/"
          (
            cd "$RUNNER_TEMP/full"
            /usr/bin/zip -qry "$RUNNER_TEMP/Meshtastic-Mod.ipa" Payload
          )
          shasum -a 256 "$RUNNER_TEMP/Meshtastic-Mod.ipa" | tee "$RUNNER_TEMP/Meshtastic-Mod.ipa.sha256"

          # Sideload-friendly IPA for free Apple IDs / Sideloadly.
          # Sideloadly rewrites the main bundle identifier when signing with a
          # Personal Team. Embedded Watch apps/extensions can retain references
          # to the original companion bundle ID and make iOS reject the install.
          rm -rf "$RUNNER_TEMP/sideload"
          mkdir -p "$RUNNER_TEMP/sideload/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/sideload/Payload/"

          SIDELOAD_APP="$RUNNER_TEMP/sideload/Payload/Meshtastic.app"
          rm -rf "$SIDELOAD_APP/Watch"
          rm -rf "$SIDELOAD_APP/PlugIns"
          rm -rf "$SIDELOAD_APP/AppClips"

          echo "Embedded app extensions after sideload stripping:"
          find "$SIDELOAD_APP" -maxdepth 4 \( -name '*.appex' -o -name '*.app' \) -print || true

          (
            cd "$RUNNER_TEMP/sideload"
            /usr/bin/zip -qry "$RUNNER_TEMP/Meshtastic-Mod-Sideload.ipa" Payload
          )
          shasum -a 256 "$RUNNER_TEMP/Meshtastic-Mod-Sideload.ipa" | tee "$RUNNER_TEMP/Meshtastic-Mod-Sideload.ipa.sha256"

      - name: Upload Meshtastic Mod IPA
        uses: actions/upload-artifact@v7
        with:
          name: Meshtastic-Mod-IPA-${{ github.sha }}
          path: |
            ${{ runner.temp }}/Meshtastic-Mod.ipa
            ${{ runner.temp }}/Meshtastic-Mod.ipa.sha256
            ${{ runner.temp }}/Meshtastic-Mod-Sideload.ipa
            ${{ runner.temp }}/Meshtastic-Mod-Sideload.ipa.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
