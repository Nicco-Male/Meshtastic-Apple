name: Apply settings node picker integration

on:
  push:
    branches:
      - feature/remote-admin-ux

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/remote-admin-ux

      - name: Patch Settings.swift
        shell: python
        run: |
          import base64
          from pathlib import Path

          path = Path("Meshtastic/Views/Settings/Settings.swift")
          text = path.read_text()
          pairs = [
              ("CWxldCBoYXNUQUtDb25maWc6IEJvb2wKCWxldCB1c2VyTG9uZ05hbWU6IFN0cmluZz8KCWxldCB1c2VySXNMaWNlbnNlZDogQm9vbA==", "CWxldCBoYXNUQUtDb25maWc6IEJvb2wKCWxldCB1c2VyTG9uZ05hbWU6IFN0cmluZz8KCWxldCB1c2VyU2hvcnROYW1lOiBTdHJpbmc/CglsZXQgdXNlcklzTGljZW5zZWQ6IEJvb2w="),
              ("CQkJdXNlckxvbmdOYW1lID0gdXNlci5sb25nTmFtZQoJCQl1c2VySXNMaWNlbnNlZCA9IHVzZXIuaXNMaWNlbnNlZA==", "CQkJdXNlckxvbmdOYW1lID0gdXNlci5sb25nTmFtZQoJCQl1c2VyU2hvcnROYW1lID0gdXNlci5zaG9ydE5hbWUKCQkJdXNlcklzTGljZW5zZWQgPSB1c2VyLmlzTGljZW5zZWQ="),
              ("CQl9IGVsc2UgewoJCQl1c2VyTG9uZ05hbWUgPSBuaWwKCQkJdXNlcklzTGljZW5zZWQgPSBmYWxzZQ==", "CQl9IGVsc2UgewoJCQl1c2VyTG9uZ05hbWUgPSBuaWwKCQkJdXNlclNob3J0TmFtZSA9IG5pbAoJCQl1c2VySXNMaWNlbnNlZCA9IGZhbHNl"),
              ("", "")
          ]

          for old64, new64 in pairs:
              old = base64.b64decode(old64).decode()
              new = base64.b64decode(new64).decode()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected one match, found {count}")
              text = text.replace(old, new, 1)

          path.write_text(text)

      - name: Commit patch
        run: |
          rm -f .github/workflows/apply-node-picker-settings.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Meshtastic/Views/Settings/Settings.swift .github/workflows/apply-node-picker-settings.yml
          git commit -m "feat: integrate searchable remote admin node picker"
          git push origin HEAD:feature/remote-admin-ux
