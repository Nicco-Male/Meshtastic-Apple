name: Apply searchable admin node picker

on:
  push:
    branches:
      - feature/remote-admin-ux

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/remote-admin-ux

      - name: Apply searchable node picker
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          settings = "Meshtastic/Views/Settings/Settings.swift"

          replace_once(
              settings,
              "\tlet hasTAKConfig: Bool\n\tlet userLongName: String?\n\tlet userIsLicensed: Bool",
              "\tlet hasTAKConfig: Bool\n\tlet userLongName: String?\n\tlet userShortName: String?\n\tlet userIsLicensed: Bool"
          )

          replace_once(
              settings,
              "\t\t\tuserLongName = user.longName\n\t\t\tuserIsLicensed = user.isLicensed",
              "\t\t\tuserLongName = user.longName\n\t\t\tuserShortName = user.shortName\n\t\t\tuserIsLicensed = user.isLicensed"
          )

          replace_once(
              settings,
              "\t\t} else {\n\t\t\tuserLongName = nil\n\t\t\tuserIsLicensed = false",
              "\t\t} else {\n\t\t\tuserLongName = nil\n\t\t\tuserShortName = nil\n\t\t\tuserIsLicensed = false"
          )

          old_picker = '''\t\t\t\tPicker("Node", selection: $selectedNode) {
\t\t\t\t\tif selectedNode == 0 {
\t\t\t\t\t\tText("Connect to a Node").tag(0)
\t\t\t\t\t}
\t\t\t\t\tForEach(sortedNodes) { node in
\t\t\t\t\t\t/// Connected Node
\t\t\t\t\t\tif node.num == accessoryManager.activeDeviceNum ?? 0 {
\t\t\t\t\t\t\tLabel {
\t\t\t\t\t\t\t\tText("Connected") + Text(verbatim: ": \\(node.userLongName?.addingVariationSelectors ?? "Unknown".localized)")
\t\t\t\t\t\t\t} icon: {
\t\t\t\t\t\t\t\taccessoryManager.activeConnection?.device.transportType.icon ?? Image(systemName: "questionmark.circle")
\t\t\t\t\t\t\t}
\t\t\t\t\t\t\t.tag(Int(node.num))
\t\t\t\t\t\t} else if node.canRemoteAdmin && UserDefaults.enableAdministration && node.hasSessionPasskey { /// Nodes using the new PKI system
\t\t\t\t\t\t\tLabel {
\t\t\t\t\t\t\t\tText("Remote PKI Admin: \\(node.userLongName ?? "Unknown".localized)")
\t\t\t\t\t\t\t} icon: {
\t\t\t\t\t\t\t\tImage(systemName: "av.remote")
\t\t\t\t\t\t\t}
\t\t\t\t\t\t\t.font(.caption2)
\t\t\t\t\t\t\t.tag(Int(node.num))
\t\t\t\t\t\t} else if !UserDefaults.enableAdministration && node.hasMetadata { /// Nodes using the old admin system
\t\t\t\t\t\t\tLabel {
\t\t\t\t\t\t\t\tText("Remote Legacy Admin: \\(node.userLongName ?? "Unknown".localized)")
\t\t\t\t\t\t\t} icon: {
\t\t\t\t\t\t\t\tImage(systemName: "av.remote")
\t\t\t\t\t\t\t}
\t\t\t\t\t\t\t.tag(Int(node.num))
\t\t\t\t\t\t} else if UserDefaults.enableAdministration && node.userIsPkiEncrypted {
\t\t\t\t\t\t\tLabel {
\t\t\t\t\t\t\t\tText("Request PKI Admin: \\(node.userLongName?.addingVariationSelectors ?? "Unknown".localized)")
\t\t\t\t\t\t\t} icon: {
\t\t\t\t\t\t\t\tImage(systemName: "rectangle.and.hand.point.up.left")
\t\t\t\t\t\t\t}
\t\t\t\t\t\t\t.tag(Int(node.num))
\t\t\t\t\t\t} else if !UserDefaults.enableAdministration {
\t\t\t\t\t\t\tLabel {
\t\t\t\t\t\t\t\tText("Request Legacy Admin: \\(node.userLongName?.addingVariationSelectors ?? "Unknown".localized)")
\t\t\t\t\t\t\t} icon: {
\t\t\t\t\t\t\t\tImage(systemName: "rectangle.and.hand.point.up.left")
\t\t\t\t\t\t\t}
\t\t\t\t\t\t\t.tag(Int(node.num))
\t\t\t\t\t\t}
\t\t\t\t\t}
\t\t\t\t}
\t\t\t\t.pickerStyle(.navigationLink)
\t\t\t\t.onChange(of: selectedNode) { _, newValue in
\t\t\t\t\thandleSelectedNodeChange(newValue)
\t\t\t\t}'''

          new_picker = '''\t\t\t\tNavigationLink {
\t\t\t\t\tSettingsNodePicker(
\t\t\t\t\t\tnodes: sortedNodes,
\t\t\t\t\t\tselectedNode: $selectedNode
\t\t\t\t\t)
\t\t\t\t} label: {
\t\t\t\t\tHStack {
\t\t\t\t\t\tText("Node")
\t\t\t\t\t\tSpacer()
\t\t\t\t\t\tText(nodeSnapshot(for: selectedNode)?.userLongName?.addingVariationSelectors ?? "Connect to a Node".localized)
\t\t\t\t\t\t\t.foregroundStyle(.secondary)
\t\t\t\t\t\t\t.lineLimit(1)
\t\t\t\t\t}
\t\t\t\t}
\t\t\t\t.onChange(of: selectedNode) { _, newValue in
\t\t\t\t\thandleSelectedNodeChange(newValue)
\t\t\t\t}'''

          replace_once(settings, old_picker, new_picker)

          picker = Path("Meshtastic/Views/Settings/SettingsNodePicker.swift")
          picker.write_text('''import SwiftUI

/// Searchable replacement for the old navigation-link Picker used by Settings > Configure.
/// The caller supplies nodes in priority order (connected, Remote Admin ready, favorites, alpha),
/// so filtering never changes the intended ranking.
struct SettingsNodePicker: View {
    @Environment(\\.dismiss) private var dismiss
    @EnvironmentObject private var accessoryManager: AccessoryManager

    let nodes: [SettingsNodeSnapshot]
    @Binding var selectedNode: Int
    @State private var searchText = ""

    private var filteredNodes: [SettingsNodeSnapshot] {
        let query = searchText.trimmingCharacters(in: .whitespacesAndNewlines)
        guard !query.isEmpty else { return nodes }

        return nodes.filter { node in
            let longName = node.userLongName ?? ""
            let shortName = node.userShortName ?? ""
            let decimalNodeNum = String(node.num)
            let hexNodeNum = String(format: "!%08x", UInt32(truncatingIfNeeded: node.num))
            return longName.localizedCaseInsensitiveContains(query)
                || shortName.localizedCaseInsensitiveContains(query)
                || decimalNodeNum.localizedCaseInsensitiveContains(query)
                || hexNodeNum.localizedCaseInsensitiveContains(query)
        }
    }

    var body: some View {
        List {
            ForEach(filteredNodes) { node in
                Button {
                    selectedNode = Int(node.num)
                    dismiss()
                } label: {
                    HStack(spacing: 12) {
                        nodeLabel(node)
                        Spacer()
                        if selectedNode == Int(node.num) {
                            Image(systemName: "checkmark")
                                .foregroundStyle(.tint)
                        }
                    }
                    .contentShape(Rectangle())
                }
                .buttonStyle(.plain)
            }
        }
        .searchable(text: $searchText, prompt: "Search nodes")
        .navigationTitle("Configure Node")
        .navigationBarTitleDisplayMode(.inline)
        .overlay {
            if filteredNodes.isEmpty {
                ContentUnavailableView.search(text: searchText)
            }
        }
    }

    @ViewBuilder
    private func nodeLabel(_ node: SettingsNodeSnapshot) -> some View {
        if node.num == accessoryManager.activeDeviceNum ?? 0 {
            Label {
                Text("Connected") + Text(verbatim: ": \\(node.userLongName?.addingVariationSelectors ?? "Unknown".localized)")
            } icon: {
                accessoryManager.activeConnection?.device.transportType.icon
                    ?? Image(systemName: "questionmark.circle")
            }
        } else if node.canRemoteAdmin && UserDefaults.enableAdministration && node.hasSessionPasskey {
            Label {
                VStack(alignment: .leading, spacing: 2) {
                    Text(node.userLongName?.addingVariationSelectors ?? "Unknown".localized)
                    Text("Remote PKI Admin")
                        .font(.caption)
                        .foregroundStyle(.secondary)
                }
            } icon: {
                Image(systemName: "av.remote")
            }
        } else if !UserDefaults.enableAdministration && node.hasMetadata {
            Label {
                VStack(alignment: .leading, spacing: 2) {
                    Text(node.userLongName?.addingVariationSelectors ?? "Unknown".localized)
                    Text("Remote Legacy Admin")
                        .font(.caption)
                        .foregroundStyle(.secondary)
                }
            } icon: {
                Image(systemName: "av.remote")
            }
        } else if UserDefaults.enableAdministration && node.userIsPkiEncrypted {
            Label {
                VStack(alignment: .leading, spacing: 2) {
                    Text(node.userLongName?.addingVariationSelectors ?? "Unknown".localized)
                    Text("Request PKI Admin")
                        .font(.caption)
                        .foregroundStyle(.secondary)
                }
            } icon: {
                Image(systemName: "rectangle.and.hand.point.up.left")
            }
        } else {
            Label {
                VStack(alignment: .leading, spacing: 2) {
                    Text(node.userLongName?.addingVariationSelectors ?? "Unknown".localized)
                    if let shortName = node.userShortName, !shortName.isEmpty {
                        Text(shortName)
                            .font(.caption)
                            .foregroundStyle(.secondary)
                    }
                }
            } icon: {
                Image(systemName: "circle")
            }
        }
    }
}
''')

      - name: Commit patch
        run: |
          rm -f .github/workflows/apply-node-picker-search.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Meshtastic/Views/Settings/Settings.swift Meshtastic/Views/Settings/SettingsNodePicker.swift .github/workflows/apply-node-picker-search.yml
          git commit -m "feat: add searchable remote admin node picker"
          git push origin HEAD:feature/remote-admin-ux
